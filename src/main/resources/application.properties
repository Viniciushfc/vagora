quarkus.http.host=127.0.0.1

quarkus.http.static-resources.caching-enabled=false

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:vagora.db
quarkus.datasource.jdbc.max-size=1
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

vagora.poll.every=60s

vagora.gemini.model=gemini-3.8-flash

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:vagora;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.jdbc.max-size=20
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.scheduler.enabled=false
