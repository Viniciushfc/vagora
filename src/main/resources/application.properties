# Credenciais
mail.host=imap.gmail.com
mail.port=993
mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}

# Polling
mail.poll.delay=60000
mail.poll.initial-delay=5000
mail.folder=INBOX

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:emails;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true

llm.gemini.api=${GEMINI_API_KEY}
# Testes: credenciais fake e polling de email adiado para não conectar em nada
%test.mail.host=localhost
%test.mail.username=test
%test.mail.password=test
%test.mail.poll.initial-delay=3600000
%test.llm.gemini.api=test
%test.LINKEDIN_LOGIN=test
%test.LINKEDIN_PASSWORD=test
%test.quarkus.hibernate-orm.log.sql=false
